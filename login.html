<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | SHAVILmath</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Poppins,sans-serif;
}

body{

    background:linear-gradient(135deg,#2563EB,#1E40AF);

    height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:20px;

}

.container{

    background:white;

    width:100%;

    max-width:430px;

    padding:45px;

    border-radius:25px;

    box-shadow:0 25px 60px rgba(0,0,0,.2);

}

.logo{

    text-align:center;

    margin-bottom:25px;

}

.logo img{

    height:70px;

}

h2{

    text-align:center;

    margin-bottom:10px;

    color:#0F172A;

}

.subtitle{

    text-align:center;

    color:#64748B;

    margin-bottom:35px;

    font-size:15px;

}

.input-group{

    margin-bottom:20px;

}

label{

    display:block;

    margin-bottom:8px;

    font-weight:600;

}

input{

    width:100%;

    padding:15px;

    border:1px solid #CBD5E1;

    border-radius:12px;

    font-size:15px;

    outline:none;

    transition:.3s;

}

input:focus{

    border-color:#2563EB;

}

button{

    width:100%;

    padding:16px;

    background:#2563EB;

    color:white;

    border:none;

    border-radius:12px;

    font-size:16px;

    font-weight:600;

    cursor:pointer;

    transition:.3s;

}

button:hover{

    background:#1E40AF;

}

.register{

    text-align:center;

    margin-top:25px;

    font-size:15px;

}

.register a{

    color:#2563EB;

    text-decoration:none;

    font-weight:600;

}

.message{

    margin-top:20px;

    text-align:center;

    font-size:15px;

    font-weight:600;

}

.success{

    color:green;

}

.error{

    color:red;

}

.divider{
    display:flex;
    align-items:center;
    gap:12px;
    margin:25px 0;
    color:#94A3B8;
    font-size:14px;
}

.divider::before,
.divider::after{
    content:"";
    flex:1;
    height:1px;
    background:#E2E8F0;
}

.google-btn{
    width:100%;
    padding:15px;
    background:white;
    color:#334155;
    border:1px solid #CBD5E1;
    border-radius:12px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;

    transition:.3s;
}

.google-btn:hover{
    background:#F8FAFC;
    border-color:#2563EB;
}

.google-icon{
    width:20px;
    height:20px;
}
</style>

</head>

<body>

<div class="container">

<div class="logo">

<img src="assets/images/logo.png" alt="SHAVILmath">

</div>

<h2>Welcome Back 👋</h2>

<p class="subtitle">

Login and continue practicing Mathematics.

</p>

<form id="loginForm">

<div class="input-group">

<label>Email</label>

<input
id="email"
type="email"
placeholder="Enter your email"
required>

</div>

<div class="input-group">

<label>Password</label>

<input
id="password"
type="password"
placeholder="Enter your password"
required>

</div>

<button type="submit">

Login

</button>

</form>

<div class="divider">

<span>OR</span>

</div>

<button
type="button"
class="google-btn"
id="googleLogin">

<svg
class="google-icon"
viewBox="0 0 24 24">

<path
fill="#4285F4"
d="M21.35 12.27c0-.79-.07-1.55-.21-2.27H12v4.3h5.23a4.47 4.47 0 0 1-1.94 2.93v2.78h3.14c1.84-1.69 2.92-4.18 2.92-7.74z"/>

<path
fill="#34A853"
d="M12 21.5c2.64 0 4.86-.87 6.48-2.36l-3.14-2.78c-.87.58-1.99.92-3.34.92-2.57 0-4.75-1.74-5.53-4.08H3.23v2.87A9.78 9.78 0 0 0 12 21.5z"/>

<path
fill="#FBBC05"
d="M6.47 13.2A5.88 5.88 0 0 1 6.16 12c0-.42.07-.82.18-1.2V7.93H3.23A9.5 9.5 0 0 0 2.5 12c0 1.46.35 2.84.73 4.07l3.24-2.87z"/>

<path
fill="#EA4335"
d="M12 6.72c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.86 3.83 14.64 2.5 12 2.5a9.78 9.78 0 0 0-8.77 5.43l3.24 2.87c.78-2.34 2.96-4.08 5.53-4.08z"/>

</svg>

Continue with Google

</button>
<div id="message" class="message"></div>

<div class="register">

Don't have an account?

<a href="register.html">

Create Account

</a>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script>

const loginForm = document.getElementById("loginForm");

const message = document.getElementById("message");

loginForm.addEventListener("submit", async (e)=>{

    e.preventDefault();

    message.innerHTML="";

    const email=document.getElementById("email").value;

    const password=document.getElementById("password").value;

    const {data,error}=await window.supabaseClient.auth.signInWithPassword({

        email:email,

        password:password

    });

    if (error) {
    console.error(error);
    alert(error.message);
    return;
}
   

    message.className="message success";

    message.innerHTML="Login successful...";

    setTimeout(()=>{

        window.location.href="dashboard.html";

    },1000);

});


const googleLogin =
    document.getElementById("googleLogin");

googleLogin.addEventListener("click", async () => {

    message.className = "message";
    message.innerHTML = "Redirecting to Google...";

    const { error } =
        await window.supabaseClient
        .auth
        .signInWithOAuth({

            provider: "google",

            options: {
                redirectTo:
                    window.location.origin +
                    "/dashboard.html"
            }

        });

    if (error) {

        console.error(error);

        message.className = "message error";

        message.innerHTML = error.message;

    }

});
</script>

</body>

</html>
