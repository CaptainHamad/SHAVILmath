<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | SHAVILmath</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

background:linear-gradient(135deg,#2563EB,#1E40AF);

height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:20px;

}

.container{

background:white;

width:100%;

max-width:430px;

padding:45px;

border-radius:25px;

box-shadow:0 25px 60px rgba(0,0,0,.2);

}

.logo{

text-align:center;

margin-bottom:25px;

}

.logo img{

height:70px;

}

h2{

text-align:center;

margin-bottom:10px;

color:#0F172A;

}

.subtitle{

text-align:center;

color:#64748B;

margin-bottom:35px;

font-size:15px;

}

.input-group{

margin-bottom:20px;

}

label{

display:block;

margin-bottom:8px;

font-weight:600;

}

input{

width:100%;

padding:15px;

border:1px solid #CBD5E1;

border-radius:12px;

font-size:15px;

outline:none;

transition:.3s;

}

input:focus{

border-color:#2563EB;

}

button{

width:100%;

padding:16px;

background:#2563EB;

color:white;

border:none;

border-radius:12px;

font-size:16px;

font-weight:600;

cursor:pointer;

transition:.3s;

}

button:hover{

background:#1E40AF;

}

.register{

text-align:center;

margin-top:25px;

font-size:15px;

}

.register a{

color:#2563EB;

text-decoration:none;

font-weight:600;

}

</style>

</head>

<body>

<div class="container">

<div class="logo">

<img src="assets/images/logo.png">

</div>

<h2>Welcome Back 👋</h2>

<p class="subtitle">

Login and continue practicing Mathematics.

</p>

<form>

<div class="input-group">

<label>Email</label>

<input
type="email"
placeholder="Enter your email">

</div>

<div class="input-group">

<label>Password</label>

<input
type="password"
placeholder="Enter your password">

</div>

<button>

Login

</button>

</form>

<div class="register">

Don't have an account?

<a href="register.html">

Create Account

</a>

</div>

</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>
</body>

</html>
