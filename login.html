<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | SHAVILmath</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Poppins,sans-serif;
}

body{

    background:linear-gradient(135deg,#2563EB,#1E40AF);

    height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:20px;

}

.container{

    background:white;

    width:100%;

    max-width:430px;

    padding:45px;

    border-radius:25px;

    box-shadow:0 25px 60px rgba(0,0,0,.2);

}

.logo{

    text-align:center;

    margin-bottom:25px;

}

.logo img{

    height:70px;

}

h2{

    text-align:center;

    margin-bottom:10px;

    color:#0F172A;

}

.subtitle{

    text-align:center;

    color:#64748B;

    margin-bottom:35px;

    font-size:15px;

}

.input-group{

    margin-bottom:20px;

}

label{

    display:block;

    margin-bottom:8px;

    font-weight:600;

}

input{

    width:100%;

    padding:15px;

    border:1px solid #CBD5E1;

    border-radius:12px;

    font-size:15px;

    outline:none;

    transition:.3s;

}

input:focus{

    border-color:#2563EB;

}

button{

    width:100%;

    padding:16px;

    background:#2563EB;

    color:white;

    border:none;

    border-radius:12px;

    font-size:16px;

    font-weight:600;

    cursor:pointer;

    transition:.3s;

}

button:hover{

    background:#1E40AF;

}

.register{

    text-align:center;

    margin-top:25px;

    font-size:15px;

}

.register a{

    color:#2563EB;

    text-decoration:none;

    font-weight:600;

}

.message{

    margin-top:20px;

    text-align:center;

    font-size:15px;

    font-weight:600;

}

.success{

    color:green;

}

.error{

    color:red;

}

</style>

</head>

<body>

<div class="container">

<div class="logo">

<img src="assets/images/logo.png" alt="SHAVILmath">

</div>

<h2>Welcome Back 👋</h2>

<p class="subtitle">

Login and continue practicing Mathematics.

</p>

<form id="loginForm">

<div class="input-group">

<label>Email</label>

<input
id="email"
type="email"
placeholder="Enter your email"
required>

</div>

<div class="input-group">

<label>Password</label>

<input
id="password"
type="password"
placeholder="Enter your password"
required>

</div>

<button type="submit">

Login

</button>

</form>

<div id="message" class="message"></div>

<div class="register">

Don't have an account?

<a href="register.html">

Create Account

</a>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script>

const loginForm = document.getElementById("loginForm");

const message = document.getElementById("message");

loginForm.addEventListener("submit", async (e)=>{

    e.preventDefault();

    message.innerHTML="";

    const email=document.getElementById("email").value;

    const password=document.getElementById("password").value;

    const {data,error}=await window.supabaseClient.auth.signInWithPassword({

        email:email,

        password:password

    });

    if (error) {
    console.error(error);
    alert(error.message);
    return;
}
   

    message.className="message success";

    message.innerHTML="Login successful...";

    setTimeout(()=>{

        window.location.href="dashboard.html";

    },1000);

});

</script>

</body>

</html>
