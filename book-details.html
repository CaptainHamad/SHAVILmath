<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Book Details | SHAVILmath</title>

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Poppins,sans-serif;
}

body{
    background:#F4F7FB;
    color:#0F172A;
}

header{
    background:#2563EB;
    padding:20px 8%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

header img{
    height:55px;
}

header a{
    color:white;
    text-decoration:none;
    font-weight:600;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:60px 8%;
}

.book{
    background:white;
    border-radius:25px;
    padding:40px;
    display:grid;
    grid-template-columns:350px 1fr;
    gap:50px;
    box-shadow:0 15px 40px rgba(0,0,0,.08);
}

.cover{
    width:100%;
    height:470px;
    background:#E2E8F0;
    border-radius:18px;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
}

.cover img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.no-cover{
    font-size:90px;
}

.details h1{
    font-size:36px;
    margin-bottom:15px;
}

.form{
    color:#2563EB;
    font-weight:600;
    margin-bottom:20px;
}

.description{
    color:#64748B;
    line-height:1.8;
    margin-bottom:25px;
}

.price{
    font-size:30px;
    font-weight:800;
    margin-bottom:25px;
}

.book-type{
    display:inline-block;
    padding:7px 14px;
    background:#EFF6FF;
    color:#2563EB;
    border-radius:20px;
    font-size:13px;
    font-weight:600;
    margin-bottom:25px;
}

.btn{
    display:block;
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:#2563EB;
    color:white;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    text-align:center;
}

.btn:hover{
    background:#1D4ED8;
}

.loading{
    text-align:center;
    padding:80px;
    color:#64748B;
}

.error{
    text-align:center;
    padding:80px;
    color:#DC2626;
}

@media(max-width:750px){

    .container{
        padding:35px 5%;
    }

    .book{
        grid-template-columns:1fr;
        padding:25px;
        gap:30px;
    }

    .cover{
        height:400px;
    }

    .details h1{
        font-size:28px;
    }

}

</style>

</head>

<body>

<header>

<img src="assets/images/logo.png">

<a href="books.html">
⬅ Back to Books
</a>

</header>


<div class="container">

<div id="bookContainer"
     class="loading">

Loading book...

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<script>

const params =
    new URLSearchParams(
        window.location.search
    );

const bookId =
    params.get("id");


async function loadBook(){

    const container =
        document.getElementById(
            "bookContainer"
        );


    if(!bookId){

        container.innerHTML = `
            <div class="error">
                Book not found.
            </div>
        `;

        return;
    }


    try{

        const {
            data:book,
            error
        } = await window.supabaseClient

            .from("books")

            .select("*")

            .eq("id",bookId)

            .eq("status","active")

            .single();


        if(error){

            throw error;

        }


        if(!book){

            throw new Error(
                "Book not found."
            );

        }


       let cover = "";

if (book.cover_path) {

    const {
        data: coverData
    } = window.supabaseClient
        .storage
        .from("book-covers")
        .getPublicUrl(book.cover_path);

    cover = `
        <img
            src="${coverData.publicUrl}"
            alt="${escapeHTML(book.title)}"
        >
    `;

} else {

    cover = `
        <div class="no-cover">
            📘
        </div>
    `;

}

        container.className =
            "book";


        container.innerHTML = `

            <div class="cover">

                ${cover}

            </div>


            <div class="details">

                <span class="book-type">

                    ${
                        book.book_type === "digital"
                        ? "DIGITAL BOOK"
                        : "PHYSICAL BOOK"
                    }

                </span>


                <h1>

                    ${escapeHTML(
                        book.title
                    )}

                </h1>


                <div class="form">

                    ${escapeHTML(
                        book.form_name ||
                        "Mathematics"
                    )}

                </div>


                <p class="description">

                    ${escapeHTML(
                        book.description ||
                        "Mathematics learning material."
                    )}

                </p>


                ${
                    book.pages
                    ? `
                        <p style="
                            margin-bottom:20px;
                            color:#64748B;
                        ">
                            📄 ${book.pages} Pages
                        </p>
                      `
                    : ""
                }


                <div class="price">

                    TSh
                    ${Number(
                        book.price
                    ).toLocaleString()}

                </div>


                <button
                    class="btn"
                    onclick="buyBook()"
                >

                    🛒 Buy Now

                </button>

            </div>

        `;


    }

    catch(error){

        console.error(
            "BOOK DETAILS ERROR:",
            error
        );


        container.className =
            "error";


        container.innerHTML = `
            Book not found.
        `;

    }

}


function escapeHTML(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function buyBook(){

    alert(
        "Payment system coming next."
    );

}


loadBook();

</script>

</body>

</html>
