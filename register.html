<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Account | SHAVILmath</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

background:linear-gradient(135deg,#2563EB,#1E40AF);

display:flex;

justify-content:center;

align-items:center;

padding:40px 20px;

min-height:100vh;

}

.container{

background:white;

width:100%;

max-width:480px;

padding:45px;

border-radius:25px;

box-shadow:0 25px 60px rgba(0,0,0,.20);

}

.logo{

text-align:center;

margin-bottom:20px;

}

.logo img{

height:70px;

}

h2{

text-align:center;

color:#0F172A;

margin-bottom:10px;

}

.subtitle{

text-align:center;

color:#64748B;

margin-bottom:30px;

font-size:15px;

}

.input-group{

margin-bottom:18px;

}

label{

display:block;

margin-bottom:8px;

font-weight:600;

}

input,select{

width:100%;

padding:15px;

border:1px solid #CBD5E1;

border-radius:12px;

font-size:15px;

outline:none;

transition:.3s;

}

input:focus,
select:focus{

border-color:#2563EB;

}

button{

width:100%;

padding:16px;

background:#2563EB;

color:white;

border:none;

border-radius:12px;

font-size:16px;

font-weight:600;

cursor:pointer;

transition:.3s;

}

button:hover{

background:#1E40AF;

}

.login{

text-align:center;

margin-top:25px;

font-size:15px;

}

.login a{

text-decoration:none;

color:#2563EB;

font-weight:600;

}

</style>

</head>

<body>

<div class="container">

<div class="logo">

<img src="assets/images/logo.png">

</div>

<h2>Create Account</h2>

<p class="subtitle">

Join SHAVILmath and start practicing today.

</p>

<form>

<div class="input-group">

<label>Full Name</label>

<input
type="text"
placeholder="Enter your full name">

</div>

<div class="input-group">

<label>School</label>

<input
type="text"
placeholder="Enter your school name">

</div>

<div class="input-group">

<label>Form</label>

<select required>

<option value="" selected disabled>Select Your Form</option>

<option value="Form I">Form I</option>

<option value="Form II">Form II</option>

<option value="Form III">Form III</option>

<option value="Form IV">Form IV</option>

</select>

</div>

<div class="input-group">

<label>Email</label>

<input
type="email"
placeholder="Enter your email">

</div>

<div class="input-group">

<label>Password</label>

<input
type="password"
placeholder="Create password">

</div>

<div class="input-group">

<label>Confirm Password</label>

<input
type="password"
placeholder="Confirm password">

</div>

<button>

Create Account

</button>

</form>

<div class="login">

Already have an account?

<a href="login.html">

Login

</a>

</div>

</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>
</body>

</html>
