<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Topics | SHAVILmath</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#F4F7FB;
}

header{

background:#2563EB;

padding:20px 8%;

display:flex;

justify-content:space-between;

align-items:center;

color:white;

}

header img{

height:60px;

}

header a{

color:white;

text-decoration:none;

font-weight:600;

}

.container{

padding:50px 8%;

}

#formTitle{

font-size:40px;

margin-bottom:10px;

color:#0F172A;

}

.subtitle{

color:#64748B;

margin-bottom:40px;

}

.topics{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(250px,1fr));

gap:25px;

}

.topic{

background:white;

padding:30px;

border-radius:20px;

cursor:pointer;

transition:.3s;

box-shadow:0 10px 30px rgba(0,0,0,.08);

}

.topic:hover{

transform:translateY(-8px);

box-shadow:0 15px 40px rgba(37,99,235,.18);

}

.topic h2{

color:#2563EB;

margin-bottom:10px;

}

.topic p{

color:#64748B;

}

.loading{

text-align:center;

font-size:22px;

padding:60px;

}

.error{

text-align:center;

color:red;

font-size:18px;

padding:40px;

}

</style>

</head>

<body>

<header>

<img src="assets/images/logo.png">

<a href="exercises.html">

⬅ Back

</a>

</header>

<div class="container">

<h1 id="formTitle">

Loading...

</h1>

<p class="subtitle">

Choose a topic to start practicing.

</p>

<div id="topicsContainer" class="topics">

<div class="loading">

Loading topics...

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script>

const form = localStorage.getItem("selectedForm");

const title=document.getElementById("formTitle");

const container=document.getElementById("topicsContainer");

title.innerHTML=form || "Topics";

async function loadTopics(){

try{

// pata form

const {data:forms,error:formError}=await window.supabaseClient

.from("forms")

.select("*")

.eq("form_name",form)

.single();

if(formError){

container.innerHTML='<div class="error">Form not found.</div>';

return;

}

// pata topics

const {data:topics,error}=await window.supabaseClient

.from("topics")

.select("*")

.eq("form_id",forms.id)

.order("topic_order");

if(error){

container.innerHTML='<div class="error">'+error.message+'</div>';

return;

}

container.innerHTML="";

if(topics.length===0){

container.innerHTML='<div class="error">No topics found.</div>';

return;

}

topics.forEach(topic=>{

container.innerHTML+=`

<div class="topic" onclick="openTopic('${topic.topic_name}')">

<h2>📘 ${topic.topic_name}</h2>

<p>

Practice questions from this topic.

</p>

</div>

`;

});

}catch(err){

container.innerHTML='<div class="error">'+err.message+'</div>';

}

}

function openTopic(topic){

localStorage.setItem("selectedTopic",topic);

window.location.href="topic.html";

}

loadTopics();

</script>

</body>

</html>
