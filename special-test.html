<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Special Test | SHAVILmath</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Poppins,sans-serif;
}

body{
    background:#F4F7FB;
    color:#0F172A;
}

header{
    background:#2563EB;
    color:white;
    padding:18px 8%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo img{
    height:50px;
}

.logo h2{
    font-size:22px;
}

.back-btn{
    color:white;
    text-decoration:none;
    font-weight:600;
}

.container{
    max-width:900px;
    margin:40px auto;
    padding:0 20px;
}

.test-header{
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
    margin-bottom:25px;
}

.test-header-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
}

.test-title h1{
    font-size:28px;
    margin-bottom:8px;
}

.test-title p{
    color:#64748B;
}

.timer{
    background:#EFF6FF;
    color:#2563EB;
    padding:12px 20px;
    border-radius:12px;
    font-size:20px;
    font-weight:700;
    white-space:nowrap;
}

.progress-area{
    margin-top:25px;
}

.progress-text{
    display:flex;
    justify-content:space-between;
    margin-bottom:10px;
    color:#475569;
    font-size:14px;
}

.progress-bar{
    height:10px;
    background:#E2E8F0;
    border-radius:20px;
    overflow:hidden;
}

.progress-fill{
    height:100%;
    width:0%;
    background:#2563EB;
    transition:.3s;
}

.question-card{
    background:white;
    padding:35px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.question-number{
    color:#2563EB;
    font-weight:700;
    margin-bottom:15px;
}

.question-text{
    font-size:22px;
    font-weight:600;
    line-height:1.6;
    margin-bottom:30px;
}

.options{
    display:grid;
    gap:15px;
}

.option{
    border:2px solid #E2E8F0;
    padding:18px;
    border-radius:14px;
    cursor:pointer;
    transition:.3s;
    display:flex;
    align-items:center;
    gap:15px;
}

.option:hover{
    border-color:#2563EB;
    background:#EFF6FF;
}

.option.selected{
    border-color:#2563EB;
    background:#EFF6FF;
}

.option-letter{
    width:38px;
    height:38px;
    border-radius:50%;
    background:#F1F5F9;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    flex-shrink:0;
}

.option.selected .option-letter{
    background:#2563EB;
    color:white;
}

.navigation{
    display:flex;
    justify-content:space-between;
    gap:15px;
    margin-top:30px;
}

.nav-btn{
    border:none;
    padding:14px 25px;
    border-radius:12px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
}

.prev-btn{
    background:#E2E8F0;
    color:#475569;
}

.next-btn{
    background:#2563EB;
    color:white;
}

.nav-btn:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.loading{
    background:white;
    padding:50px;
    border-radius:20px;
    text-align:center;
    color:#64748B;
}

.result-card{
    display:none;
    background:white;
    padding:50px 30px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
    text-align:center;
}

.result-icon{
    font-size:70px;
    margin-bottom:15px;
}

.result-card h1{
    margin-bottom:10px;
}

.result-card p{
    color:#64748B;
    margin-bottom:25px;
}

.score{
    font-size:45px;
    font-weight:800;
    color:#2563EB;
    margin:20px 0;
}

.result-details{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin:30px 0;
}

.result-box{
    background:#F8FAFC;
    padding:20px;
    border-radius:15px;
}

.result-box h3{
    font-size:24px;
    color:#2563EB;
}

.result-box p{
    margin:5px 0 0;
    font-size:13px;
}

.finish-btn{
    display:inline-block;
    background:#2563EB;
    color:white;
    padding:15px 30px;
    border-radius:12px;
    text-decoration:none;
    font-weight:600;
}

@media(max-width:700px){

    .test-header-top{
        flex-direction:column;
        align-items:flex-start;
    }

    .question-card{
        padding:25px 20px;
    }

    .question-text{
        font-size:19px;
    }

    .result-details{
        grid-template-columns:1fr;
    }

    .navigation{
        flex-direction:column;
    }

}

</style>

</head>

<body>


<header>

<div class="logo">

<img src="assets/images/logo.png">

<h2>SHAVILmath</h2>

</div>

<a href="special-test-list.html" class="back-btn">
← Exit Test
</a>

</header>


<div class="container">


<!-- LOADING -->

<div
id="loading"
class="loading">

Loading Special Test...

</div>



<!-- TEST AREA -->

<div
id="testArea"
style="display:none;">


<div class="test-header">

<div class="test-header-top">

<div class="test-title">

<h1 id="testTitle">

Special Test

</h1>

<p id="testDescription">

Loading test...

</p>

</div>


<div
class="timer"
id="timer">

00:00

</div>

</div>


<div class="progress-area">

<div class="progress-text">

<span id="questionProgress">
Question 1 of 0
</span>

<span id="answeredCount">
0 Answered
</span>

</div>


<div class="progress-bar">

<div
class="progress-fill"
id="progressFill">

</div>

</div>

</div>

</div>



<div class="question-card">


<div
class="question-number"
id="questionNumber">

Question 1

</div>


<div
class="question-text"
id="questionText">

Loading question...

</div>


<div
class="options"
id="optionsContainer">

</div>


<div class="navigation">

<button
class="nav-btn prev-btn"
id="prevButton">

← Previous

</button>


<button
class="nav-btn next-btn"
id="nextButton">

Next →

</button>

</div>


</div>

</div>



<!-- RESULT -->

<div
id="resultCard"
class="result-card">

<div class="result-icon">
🏆
</div>

<h1>
Test Completed!
</h1>

<p id="resultMessage">
Great work! Here is your result.
</p>

<div
class="score"
id="scoreDisplay">

0%

</div>


<div class="result-details">


<div class="result-box">

<h3 id="correctCount">
0
</h3>

<p>
Correct Answers
</p>

</div>


<div class="result-box">

<h3 id="wrongCount">
0
</h3>

<p>
Wrong Answers
</p>

</div>


<div class="result-box">

<h3 id="totalQuestions">
0
</h3>

<p>
Total Questions
</p>

</div>


</div>


<a
href="special-test-list.html"
class="finish-btn">

← Back to Special Tests

</a>

</div>


</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<script>


/* =========================================
   VARIABLES
========================================= */

let currentUser = null;

let selectedTestId =
    localStorage.getItem(
        "selectedSpecialTestId"
    );

let questions = [];

let currentQuestionIndex = 0;

let answers = {};

let timerInterval;

let timeRemaining = 0;


/* =========================================
   START APPLICATION
========================================= */

async function startTest(){

    /* CHECK TEST */

    if(!selectedTestId){

        window.location.href =
            "special-test-list.html";

        return;

    }


    /* GET USER */

    const {

        data:{
            user
        }

    } = await window.supabaseClient
        .auth
        .getUser();


    if(!user){

        window.location.href =
            "login.html";

        return;

    }


    currentUser = user;


    /* =====================================
       CHECK PREMIUM STATUS
    ===================================== */

    const {

        data:profile,

        error:profileError

    } = await window.supabaseClient

        .from("profiles")

        .select(`
            subscription_plan,
            subscription_expires_at
        `)

        .eq(
            "id",
            user.id
        )

        .single();


    let isPremium = false;


    if(

        !profileError &&

        profile &&

        profile.subscription_plan ===
        "premium" &&

        profile.subscription_expires_at

    ){

        const expiryDate =
            new Date(
                profile.subscription_expires_at
            );


        const now =
            new Date();


        if(expiryDate > now){

            isPremium = true;

        }

    }


    /* SPECIAL TEST = PREMIUM */

    if(!isPremium){

        window.location.href =
            "premium.html";

        return;

    }


    /* LOAD TEST */

    await loadTest();

}


/* =========================================
   LOAD TEST
========================================= */

async function loadTest(){


    document.getElementById(
        "loading"
    ).style.display =
        "block";


    /* GET TEST */

    const {

        data:test,

        error:testError

    } = await window.supabaseClient

        .from("special_tests")

        .select("*")

        .eq(
            "id",
            selectedTestId
        )

        .single();


    if(testError || !test){

        console.error(
            "TEST ERROR:",
            testError
        );


        document.getElementById(
            "loading"
        ).innerHTML =

            "⚠️ Failed to load this test.";

        return;

    }


    /* DISPLAY TEST */

    document.getElementById(
        "testTitle"
    ).innerHTML =
        test.title ||
        "Special Test";


    document.getElementById(
        "testDescription"
    ).innerHTML =
        test.description ||
        "Answer all questions before time runs out.";


    /* =====================================
       LOAD QUESTIONS
    ===================================== */

    const {

        data:questionData,

        error:questionError

    } = await window.supabaseClient

        .from("special_test_questions")

        .select("*")

        .eq(
            "test_id",
            selectedTestId
        )

        .order(
            "question_number",
            {
                ascending:true
            }
        );


    if(questionError){

        console.error(
            "QUESTION ERROR:",
            questionError
        );


        document.getElementById(
            "loading"
        ).innerHTML =

            "⚠️ Failed to load questions.";

        return;

    }


    questions =
        questionData || [];


    if(questions.length === 0){

        document.getElementById(
            "loading"
        ).innerHTML =

            "⚠️ No questions have been added to this test yet.";

        return;

    }


    /* =====================================
       SET TIMER
    ===================================== */

    let durationMinutes =
        Number(
            test.duration_minutes
        );


    if(
        !durationMinutes ||
        durationMinutes <= 0
    ){

        durationMinutes = 30;

    }


    timeRemaining =
        durationMinutes * 60;


    startTimer();


    /* SHOW TEST */

    document.getElementById(
        "loading"
    ).style.display =
        "none";


    document.getElementById(
        "testArea"
    ).style.display =
        "block";


    renderQuestion();

}


/* =========================================
   TIMER
========================================= */

function startTimer(){

    updateTimerDisplay();


    timerInterval =
        setInterval(
            function(){

                timeRemaining--;


                updateTimerDisplay();


                if(timeRemaining <= 0){

                    clearInterval(
                        timerInterval
                    );


                    finishTest();

                }

            },
            1000
        );

}


function updateTimerDisplay(){

    let minutes =
        Math.floor(
            timeRemaining / 60
        );


    let seconds =
        timeRemaining % 60;


    minutes =
        String(minutes)
        .padStart(2,"0");


    seconds =
        String(seconds)
        .padStart(2,"0");


    document.getElementById(
        "timer"
    ).innerHTML =
        minutes +
        ":" +
        seconds;

}


/* =========================================
   RENDER QUESTION
========================================= */

function renderQuestion(){

    const question =
        questions[
            currentQuestionIndex
        ];


    document.getElementById(
        "questionNumber"
    ).innerHTML =

        "Question " +
        (
            currentQuestionIndex + 1
        );


    document.getElementById(
        "questionText"
    ).innerHTML =
        question.question;


    const optionsContainer =
        document.getElementById(
            "optionsContainer"
        );


    optionsContainer.innerHTML =
        "";


    const optionLetters =
        ["A","B","C","D"];


    const optionValues =
        [

            question.option_a,

            question.option_b,

            question.option_c,

            question.option_d

        ];


    optionValues.forEach(
        function(option,index){

            if(
                option === null ||
                option === undefined ||
                option === ""
            ){

                return;

            }


            const optionElement =
                document.createElement(
                    "div"
                );


            optionElement.className =
                "option";


            const selectedAnswer =
                answers[
                    question.id
                ];


            if(
                selectedAnswer ===
                optionLetters[index]
            ){

                optionElement.classList.add(
                    "selected"
                );

            }


            optionElement.innerHTML =

                `

                <div class="option-letter">

                ${optionLetters[index]}

                </div>

                <div>

                ${option}

                </div>

                `;


            optionElement.addEventListener(
                "click",
                function(){

                    answers[
                        question.id
                    ] =
                        optionLetters[index];


                    renderQuestion();

                    updateProgress();

                }
            );


            optionsContainer.appendChild(
                optionElement
            );

        }
    );


    /* QUESTION PROGRESS */

    document.getElementById(
        "questionProgress"
    ).innerHTML =

        "Question " +

        (
            currentQuestionIndex + 1
        ) +

        " of " +

        questions.length;


    /* BUTTONS */

    const prevButton =
        document.getElementById(
            "prevButton"
        );


    prevButton.disabled =
        currentQuestionIndex === 0;


    const nextButton =
        document.getElementById(
            "nextButton"
        );


    if(
        currentQuestionIndex ===
        questions.length - 1
    ){

        nextButton.innerHTML =
            "Finish Test ✓";

    }

    else{

        nextButton.innerHTML =
            "Next →";

    }


    updateProgress();

}


/* =========================================
   UPDATE PROGRESS
========================================= */

function updateProgress(){


    const answeredQuestions =
        Object.keys(
            answers
        ).length;


    document.getElementById(
        "answeredCount"
    ).innerHTML =

        answeredQuestions +

        " Answered";


    const percentage =

        (
            answeredQuestions /
            questions.length
        )

        * 100;


    document.getElementById(
        "progressFill"
    ).style.width =

        percentage +
        "%";

}


/* =========================================
   PREVIOUS BUTTON
========================================= */

document.getElementById(
    "prevButton"
).addEventListener(
    "click",
    function(){

        if(
            currentQuestionIndex > 0
        ){

            currentQuestionIndex--;

            renderQuestion();

        }

    }
);


/* =========================================
   NEXT BUTTON
========================================= */

document.getElementById(
    "nextButton"
).addEventListener(
    "click",
    function(){

        if(

            currentQuestionIndex <

            questions.length - 1

        ){

            currentQuestionIndex++;

            renderQuestion();

        }

        else{

            const confirmFinish =
                confirm(
                    "Are you sure you want to finish the test?"
                );


            if(confirmFinish){

                finishTest();

            }

        }

    }
);


/* =========================================
   FINISH TEST
========================================= */

async function finishTest(){


    clearInterval(
        timerInterval
    );


    document.getElementById(
        "testArea"
    ).style.display =
        "none";


    document.getElementById(
        "resultCard"
    ).style.display =
        "block";


    let correct = 0;

    let wrong = 0;


    questions.forEach(
        function(question){

            const userAnswer =
                answers[
                    question.id
                ];


            if(
                userAnswer ===
                question.correct_answer
            ){

                correct++;

            }

            else{

                wrong++;

            }

        }
    );


    const total =
        questions.length;


    const score =
        Math.round(

            (
                correct /
                total
            )

            * 100

        );


    /* DISPLAY RESULT */

    document.getElementById(
        "scoreDisplay"
    ).innerHTML =
        score +
        "%";


    document.getElementById(
        "correctCount"
    ).innerHTML =
        correct;


    document.getElementById(
        "wrongCount"
    ).innerHTML =
        wrong;


    document.getElementById(
        "totalQuestions"
    ).innerHTML =
        total;


    /* RESULT MESSAGE */

    let message =
        "Keep practicing! You can do even better.";


    if(score >= 80){

        message =
            "Excellent work! You have performed brilliantly! 🎉";

    }

    else if(score >= 60){

        message =
            "Good job! Keep practicing to become even better.";

    }


    document.getElementById(
        "resultMessage"
    ).innerHTML =
        message;


    /* =====================================
       SAVE RESULT
    ===================================== */

    const {

        error

    } = await window.supabaseClient

        .from("special_test_results")

        .insert({

            user_id:
                currentUser.id,

            test_id:
                selectedTestId,

            total_questions:
                total,

            correct_answers:
                correct,

            wrong_answers:
                wrong,

            score:
                score

        });


    if(error){

        console.error(
            "SAVE RESULT ERROR:",
            error
        );

    }

    else{

        console.log(
            "Test result saved successfully"
        );

    }

}


/* =========================================
   START
========================================= */

startTest();


</script>


</body>

</html>
