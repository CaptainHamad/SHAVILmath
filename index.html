<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SHAVILmath | Learn Mathematics The Smart Way</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#F8FAFC;
    color:#1E293B;
}

header{
    position:fixed;
    width:100%;
    top:0;
    background:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 8%;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
    z-index:1000;
}

.logo{
    font-size:30px;
    font-weight:800;
    color:#2563EB;
}

.logo span{
    color:#F59E0B;
}

nav a{
    text-decoration:none;
    color:#334155;
    margin-left:30px;
    font-weight:500;
    transition:.3s;
}

nav a:hover{
    color:#2563EB;
}

.hero{

    min-height:100vh;

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:120px 8% 60px;

    gap:50px;

    flex-wrap:wrap;
}

.left{

    flex:1;
    min-width:300px;
}

.left h1{

    font-size:60px;

    line-height:1.2;

    margin-bottom:20px;
}

.left h1 span{

    color:#2563EB;
}

.left p{

    color:#64748B;

    font-size:20px;

    line-height:1.8;

    margin-bottom:40px;
}

.buttons{

    display:flex;

    gap:20px;

    flex-wrap:wrap;
}

.btn{

    padding:16px 34px;

    border-radius:10px;

    text-decoration:none;

    font-weight:600;

    transition:.3s;
}

.primary{

    background:#2563EB;

    color:white;
}

.primary:hover{

    transform:translateY(-3px);

    background:#1E40AF;
}

.secondary{

    border:2px solid #2563EB;

    color:#2563EB;
}

.secondary:hover{

    background:#2563EB;

    color:white;
}

.right{

    flex:1;

    display:flex;

    justify-content:center;

    min-width:300px;
}

.circle{

    width:420px;

    height:420px;

    border-radius:50%;

    background:linear-gradient(135deg,#2563EB,#60A5FA);

    display:flex;

    justify-content:center;

    align-items:center;

    color:white;

    font-size:120px;

    box-shadow:0 30px 80px rgba(37,99,235,.35);
}

@media(max-width:900px){

header{

flex-direction:column;

gap:15px;
}

nav{

display:flex;

flex-wrap:wrap;

justify-content:center;
}

nav a{

margin:8px 12px;
}

.hero{

text-align:center;
}

.buttons{

justify-content:center;
}

.left h1{

font-size:42px;
}

.circle{

width:280px;

height:280px;

font-size:80px;
}

}

</style>

</head>

<body>

<header>

<div class="logo">
SHAVIL<span>math</span>
</div>

<nav>

<a href="#">Home</a>

<a href="#">Topics</a>

<a href="#">Quiz</a>

<a href="#">About</a>

<a href="#">Login</a>

</nav>

</header>

<section class="hero">

<div class="left">

<h1>

Learn <span>Mathematics</span><br>

The Smart Way

</h1>

<p>

Master mathematics with interactive lessons,
practice questions, quizzes, and detailed explanations.
Designed especially for Tanzanian students.

</p>

<div class="buttons">

<a href="#" class="btn primary">

Start Learning

</a>

<a href="#" class="btn secondary">

Explore Topics

</a>

</div>

</div>

<div class="right">

<div class="circle">

📘

</div>

</div>

</section>

</body>
</html>
