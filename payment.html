<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Payment | SHAVILmath</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Poppins,sans-serif;
}

body{
    background:#F4F7FB;
    color:#0F172A;
}

header{
    background:#2563EB;
    padding:20px 8%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

header img{
    height:55px;
}

.back-btn{
    color:white;
    text-decoration:none;
    font-weight:600;
}

.container{
    max-width:600px;
    margin:60px auto;
    padding:0 20px;
}

.payment-card{
    background:white;
    padding:40px;
    border-radius:25px;
    box-shadow:0 15px 40px rgba(0,0,0,.08);
}

.payment-card h1{
    text-align:center;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#64748B;
    margin-bottom:30px;
}

.order-summary{
    background:#F8FAFC;
    border:1px solid #E2E8F0;
    border-radius:16px;
    padding:25px;
    margin-bottom:30px;
}

.summary-row{
    display:flex;
    justify-content:space-between;
    margin-bottom:15px;
    color:#475569;
}

.summary-row:last-child{
    margin-bottom:0;
}

.total{
    border-top:1px solid #CBD5E1;
    padding-top:15px;
    font-size:20px;
    font-weight:700;
    color:#0F172A;
}

.payment-title{
    margin-bottom:18px;
    font-size:18px;
}

.payment-options{
    display:grid;
    gap:15px;
}

.payment-option{
    border:1px solid #CBD5E1;
    border-radius:14px;
    padding:18px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:12px;
    transition:.3s;
}

.payment-option:hover,
.payment-option.selected{
    border-color:#2563EB;
    background:#EFF6FF;
}

.payment-option input{
    accent-color:#2563EB;
}

.pay-btn{
    width:100%;
    margin-top:30px;
    padding:16px;
    border:none;
    border-radius:12px;
    background:#2563EB;
    color:white;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
}

.pay-btn:hover{
    background:#1E40AF;
}

.message{
    text-align:center;
    margin-top:18px;
    font-weight:600;
}

</style>

</head>

<body>

<header>

<img src="assets/images/logo.png" alt="SHAVILmath">

<a href="premium.html" class="back-btn">
← Change Plan
</a>

</header>


<div class="container">

<div class="payment-card">

<h1>Complete Your Payment 💳</h1>

<p class="subtitle">
You are about to upgrade your SHAVILmath account.
</p>


<div class="order-summary">

<div class="summary-row">

<span>Plan</span>

<strong id="planName">
Loading...
</strong>

</div>


<div class="summary-row">

<span>Access</span>

<strong id="planDays">
-
</strong>

</div>


<div class="summary-row total">

<span>Total</span>

<strong id="planPrice">
TSh 0
</strong>

</div>

</div>


<h3 class="payment-title">
Choose Payment Method
</h3>


<div class="payment-options">

<label class="payment-option">

<input
type="radio"
name="payment"
value="mpesa">

<span>📱 M-Pesa</span>

</label>


<label class="payment-option">

<input
type="radio"
name="payment"
value="airtel">

<span>📱 Airtel Money</span>

</label>


<label class="payment-option">

<input
type="radio"
name="payment"
value="tigopesa">

<span>📱 Tigo Pesa</span>

</label>


<label class="payment-option">

<input
type="radio"
name="payment"
value="halopesa">

<span>📱 HaloPesa</span>

</label>

</div>


<button
class="pay-btn"
id="payButton">

Proceed to Payment

</button>


<div
id="message"
class="message">

</div>

</div>

</div>


<script>

/* READ SELECTED PLAN */

const selectedPlan =
    localStorage.getItem(
        "selectedPlan"
    );

const selectedPrice =
    localStorage.getItem(
        "selectedPrice"
    );

const selectedDays =
    localStorage.getItem(
        "selectedDays"
    );


/* CHECK IF USER SELECTED A PLAN */

if(

    !selectedPlan ||

    !selectedPrice ||

    !selectedDays

){

    window.location.href =
        "premium.html";

}


/* PLAN NAMES */

const planNames = {

    weekly:
        "Weekly Premium",

    monthly:
        "Monthly Premium",

    "3months":
        "3 Months Premium",

    yearly:
        "Yearly Premium"

};


/* DISPLAY PLAN */

document.getElementById(
    "planName"
).innerHTML =

    planNames[selectedPlan] ||
    selectedPlan;


document.getElementById(
    "planDays"
).innerHTML =

    selectedDays + " Days";


document.getElementById(
    "planPrice"
).innerHTML =

    "TSh " +
    Number(
        selectedPrice
    ).toLocaleString();


/* SELECT PAYMENT OPTION */

const paymentOptions =

    document.querySelectorAll(
        ".payment-option"
    );


paymentOptions.forEach(option => {

    option.addEventListener(
        "click",
        function(){

            paymentOptions.forEach(
                item =>
                item.classList.remove(
                    "selected"
                )
            );

            this.classList.add(
                "selected"
            );

            this.querySelector(
                "input"
            ).checked = true;

        }

    );

});


/* PROCEED BUTTON */

document.getElementById(
    "payButton"
).addEventListener(
    "click",
    function(){

        const selectedPayment =

            document.querySelector(
                'input[name="payment"]:checked'
            );


        if(!selectedPayment){

            document.getElementById(
                "message"
            ).innerHTML =

                "⚠️ Please choose a payment method.";

            return;

        }


        /*
        HII SEHEMU TUTAUNGANISHA
        PAYMENT GATEWAY BAADAYE
        */

        console.log(
            "PLAN:",
            selectedPlan
        );

        console.log(
            "PRICE:",
            selectedPrice
        );

        console.log(
            "DAYS:",
            selectedDays
        );

        console.log(
            "PAYMENT METHOD:",
            selectedPayment.value
        );


        document.getElementById(
            "message"
        ).innerHTML =

            "Payment system is being prepared...";

    }

);

</script>

</body>

</html>
