<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Practice Questions | SHAVILmath</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Poppins,sans-serif;
}

body{
    background:#F4F7FB;
    color:#0F172A;
}

/* HEADER */

header{

    background:#2563EB;

    padding:18px 8%;

    display:flex;

    justify-content:space-between;

    align-items:center;

    color:white;

}

header img{
    height:55px;
}

header a{

    color:white;

    text-decoration:none;

    font-weight:600;

}

/* MAIN */

.container{

    width:100%;

    max-width:900px;

    margin:auto;

    padding:45px 20px;

}

/* TOP INFO */

.top-info{

    background:white;

    padding:25px;

    border-radius:20px;

    box-shadow:0 10px 30px rgba(0,0,0,.07);

    margin-bottom:25px;

}

.top-info h1{

    font-size:28px;

    margin-bottom:8px;

}

.top-info p{

    color:#64748B;

}

/* PROGRESS */

.progress-area{

    margin-top:20px;

}

.progress-text{

    display:flex;

    justify-content:space-between;

    margin-bottom:8px;

    font-size:14px;

    color:#64748B;

}

.progress{

    width:100%;

    height:10px;

    background:#E2E8F0;

    border-radius:20px;

    overflow:hidden;

}

.progress-bar{

    height:100%;

    width:0%;

    background:#2563EB;

    transition:.3s;

}

/* QUESTION CARD */

.question-card{

    background:white;

    padding:35px;

    border-radius:20px;

    box-shadow:0 15px 35px rgba(0,0,0,.08);

}

.question-number{

    color:#2563EB;

    font-weight:700;

    margin-bottom:15px;

}

.question-text{

    font-size:22px;

    line-height:1.6;

    margin-bottom:30px;

}

/* OPTIONS */

.options{

    display:flex;

    flex-direction:column;

    gap:15px;

}

.option{

    width:100%;

    padding:18px;

    border:2px solid #E2E8F0;

    border-radius:14px;

    background:white;

    text-align:left;

    cursor:pointer;

    font-size:16px;

    transition:.2s;

}

.option:hover{

    border-color:#2563EB;

    background:#EFF6FF;

}

.option.selected{

    border-color:#2563EB;

    background:#EFF6FF;

}

/* NEXT */

.actions{

    margin-top:30px;

    display:flex;

    justify-content:flex-end;

}

.next-btn{

    padding:14px 30px;

    border:none;

    border-radius:12px;

    background:#2563EB;

    color:white;

    font-size:16px;

    font-weight:600;

    cursor:pointer;

}

.next-btn:hover{

    background:#1D4ED8;

}

.next-btn:disabled{

    background:#CBD5E1;

    cursor:not-allowed;

}

/* LOADING */

.loading{

    text-align:center;

    padding:70px;

    color:#64748B;

    font-size:18px;

}

/* ERROR */

.error{

    text-align:center;

    padding:50px;

    color:#DC2626;

}

/* MOBILE */

@media(max-width:600px){

    .container{
        padding:30px 15px;
    }

    .question-card{
        padding:25px;
    }

    .question-text{
        font-size:19px;
    }

}

</style>

</head>

<body>

<header>

<img src="assets/images/logo.png">

<a href="difficulty.html">

⬅ Back

</a>

</header>


<div class="container">

    <div class="top-info">

        <h1 id="topicTitle">
            Loading...
        </h1>

        <p id="difficultyText">
            Loading difficulty...
        </p>

        <div class="progress-area">

            <div class="progress-text">

                <span id="questionProgress">
                    Question 0 of 0
                </span>

                <span id="scoreText">
                    Score: 0
                </span>

            </div>

            <div class="progress">

                <div
                    id="progressBar"
                    class="progress-bar">
                </div>

            </div>

        </div>

    </div>


    <div id="questionContainer">

        <div class="loading">

            Loading questions...

        </div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<script>

/* ==============================
   GET SAVED INFORMATION
============================== */

const topicId =
    localStorage.getItem("selectedTopicId");

const topicName =
    localStorage.getItem("selectedTopic");

const difficulty =
    localStorage.getItem("difficulty");


/* ==============================
   ELEMENTS
============================== */

const topicTitle =
    document.getElementById("topicTitle");

const difficultyText =
    document.getElementById("difficultyText");

const questionContainer =
    document.getElementById("questionContainer");

const questionProgress =
    document.getElementById("questionProgress");

const scoreText =
    document.getElementById("scoreText");

const progressBar =
    document.getElementById("progressBar");


/* ==============================
   QUESTIONS
============================== */

let questions = [];

let currentQuestion = 0;

let score = 0;

let selectedAnswer = null;


/* ==============================
   DISPLAY TOPIC
============================== */

topicTitle.innerHTML =
    topicName || "Practice Questions";

difficultyText.innerHTML =
    "Difficulty: " + (difficulty || "All Levels");


/* ==============================
   LOAD QUESTIONS
============================== */

async function loadQuestions(){

    try{

        if(!topicId){

            questionContainer.innerHTML = `
                <div class="error">

                    No topic selected.

                </div>
            `;

            return;

        }


        let query =
            window.supabaseClient
            .from("questions")
            .select("*")
            .eq("topic_id", topicId)
            .eq("status", "Published");


        /* ==============================
           FILTER DIFFICULTY
        ============================== */

        if(difficulty === "Easy"){

            query = query.eq("difficulty", 1);

        }

        else if(difficulty === "Medium"){

            query = query.eq("difficulty", 2);

        }

        else if(difficulty === "Hard"){

            query = query.eq("difficulty", 3);

        }


        const {

            data,
            error

        } = await query;


        console.log("QUESTIONS =", data);

        console.log("QUESTION ERROR =", error);


        if(error){

            questionContainer.innerHTML = `
                <div class="error">

                    ${error.message}

                </div>
            `;

            return;

        }


        if(!data || data.length === 0){

            questionContainer.innerHTML = `

                <div class="error">

                    <h2>No questions available yet.</h2>

                    <p style="margin-top:10px">

                        Questions for this topic and difficulty
                        have not been added yet.

                    </p>

                </div>

            `;

            return;

        }


        questions = data;


        showQuestion();


    }

    catch(error){

        console.error(error);

        questionContainer.innerHTML = `

            <div class="error">

                Something went wrong.

            </div>

        `;

    }

}


/* ==============================
   SHOW QUESTION
============================== */

async function showQuestion(){

    selectedAnswer = null;


    const question =
        questions[currentQuestion];


    questionProgress.innerHTML =

        `Question ${currentQuestion + 1} of ${questions.length}`;


    scoreText.innerHTML =

        `Score: ${score}`;


    const progress =
        ((currentQuestion + 1) / questions.length) * 100;


    progressBar.style.width =
        progress + "%";


    /* ==============================
       GET OPTIONS
    ============================== */

    const {

        data: options,
        error

    } = await window.supabaseClient

        .from("question_options")

        .select("*")

        .eq("question_id", question.id)

        .order("option_letter");


    if(error){

        console.error(error);

        return;

    }


    let optionsHTML = "";


    options.forEach(option => {

        optionsHTML += `

            <button
                class="option"
                onclick="selectAnswer('${option.option_letter}', this)"
            >

                <strong>
                    ${option.option_letter}.
                </strong>

                ${option.option_text}

            </button>

        `;

    });


    questionContainer.innerHTML = `

        <div class="question-card">

            <div class="question-number">

                Question ${currentQuestion + 1}

            </div>

            <div class="question-text">

                ${question.question}

            </div>

            <div class="options">

                ${optionsHTML}

            </div>

            <div class="actions">

                <button
                    id="nextButton"
                    class="next-btn"
                    disabled
                    onclick="nextQuestion()"
                >

                    ${currentQuestion === questions.length - 1
                        ? "Finish"
                        : "Next →"}

                </button>

            </div>

        </div>

    `;

}


/* ==============================
   SELECT ANSWER
============================== */

function selectAnswer(answer, button){

    selectedAnswer = answer;


    document
        .querySelectorAll(".option")
        .forEach(option => {

            option.classList.remove("selected");

        });


    button.classList.add("selected");


    document.getElementById("nextButton")
        .disabled = false;

}


/* ==============================
   NEXT QUESTION
============================== */

function nextQuestion(){

    if(!selectedAnswer){

        return;

    }


    const question =
        questions[currentQuestion];


    if(selectedAnswer === question.correct_answer){

        score++;

    }


    currentQuestion++;


    if(currentQuestion >= questions.length){

        finishQuiz();

        return;

    }


    showQuestion();

}


/* ==============================
   FINISH
============================== */

function finishQuiz(){

    localStorage.setItem(
        "quizScore",
        score
    );

    localStorage.setItem(
        "quizTotal",
        questions.length
    );

    window.location.href =
        "results.html";

}


/* ==============================
   START
============================== */

loadQuestions();

</script>

</body>

</html>
