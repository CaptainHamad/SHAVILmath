}
let questions = [];

let currentQuestionIndex = 0;

let score = 0;

let selectedAnswer = null;

let answerReview = [];

/* =========================
   LOAD QUESTIONS
========================= */

async function loadQuestions() {

    try {

        // =====================================
// QUESTION OF THE DAY
// =====================================

if(dailyQuestionId){

    const {

        data,

        error

    } = await window.supabaseClient

        .from("questions")

        .select("*")

        .eq(
            "id",
            Number(dailyQuestionId)
        )

        .eq(
            "status",
            "Published"
        );


    if(error){

        throw error;

    }


    if(!data || data.length === 0){

        questionContainer.innerHTML = `

            <div class="error">

                <h2>Question not available</h2>

                <p>
                    Today's question could not be found.
                </p>

            </div>

        `;

        return;

    }


    questions = data;


    currentQuestionIndex = 0;

    score = 0;

    answerReview = [];


    showQuestion();

    return;

}


// =====================================
// NORMAL EXERCISES
// =====================================

if(!topicId){

    questionContainer.innerHTML = `

        <div class="error">

            <h2>No topic selected</h2>

            <p>
                Please go back and select a topic.
            </p>

        </div>

    `;

    return;

}


if(

    difficulty !== "1" &&
    difficulty !== "2" &&
    difficulty !== "3" &&
    difficulty !== "Mixed"

){

    questionContainer.innerHTML = `

        <div class="error">

            <h2>Invalid difficulty</h2>

            <p>
                Please go back and select
                a difficulty level.
            </p>

        </div>

    `;

    return;

}


let query = window.supabaseClient

    .from("questions")

    .select("*")

    .eq(
        "topic_id",
        Number(topicId)
    )

    .eq(
        "status",
        "Published"
    );


if(difficulty === "Mixed"){

    query = query

        .eq(
            "set_name",
            "Mixed"
        );

}

else{

    query = query

        .eq(
            "difficulty",
            Number(difficulty)
        )

        .neq(
            "set_name",
            "Mixed"
        );

}


const {

    data,

    error

} = await query.order(
    "question_order",
    {
        ascending:true
    }
);
        console.log("QUESTIONS =", data);

        console.log("QUESTION ERROR =", error);


        if (error) {

            questionContainer.innerHTML = `
                <div class="error">

                    <h2>Unable to load questions</h2>

                    <p>
                        ${escapeHTML(error.message)}
                    </p>

                </div>
            `;

            return;

        }


        if (!data || data.length === 0) {

            questionContainer.innerHTML = `

                    <h2>No questions available</h2>

                    <p>
                        There are no questions for
                        this topic and difficulty yet.
                    </p>

                </div>
            `;

            return;

        }


        questions = data.slice(0, 15);


        currentQuestionIndex = 0;

        score = 0;

        answerReview = [];

        showQuestion();

    }

    catch (error) {

        console.error("LOAD QUESTIONS ERROR =", error);

        questionContainer.innerHTML = `

                    ${escapeHTML(error.message)}

}


/* =========================
   SHOW QUESTION
========================= */

async function showQuestion() {

    try {

        selectedAnswer = null;


        const question =
            questions[currentQuestionIndex];


        if (!question) {

            return;

        }


        const number =
            currentQuestionIndex + 1;

        const total =
            questions.length;


        questionNumber.textContent =
            `Question ${number} of ${total}`;


        scoreDisplay.textContent =
            `Score: ${score}`;


        const percentage =
            (number / total) * 100;


        progressBar.style.width =
            percentage + "%";


        const {
            data: options,
            error
        } = await window.supabaseClient

            .from("question_options")

            .select("*")

            .eq("question_id", question.id)

            .order("option_order", {
                ascending: true
            });


        console.log("OPTIONS =", options);

        console.log("OPTION ERROR =", error);


        if (error) {

            questionContainer.innerHTML = `
                <div class="error">

                    <h2>Unable to load answers</h2>

                    <p>
                        ${escapeHTML(error.message)}
                    </p>

                </div>
            `;

            return;

        }


        question._options = options || [];


        let optionsHTML = "";


        question._options.forEach(option => {

            optionsHTML += `

                <button
                    type="button"
                    class="option"
                    onclick="selectAnswer('${escapeValue(option.option_letter)}', this)"
                >

                    <span class="option-letter">

                        ${escapeHTML(option.option_letter)}

                    </span>

                    <span>

                        ${escapeHTML(option.option_text)}

                    </span>

                </button>

            `;

        });


       const diagramHTML =
    question.diagram_svg
        ? `
            <div class="question-diagram">
                ${question.diagram_svg}
            </div>
        `
        : "";


questionContainer.innerHTML = `

    <div class="question-card">

        <div class="question-label">

            Question ${number}

        </div>


        <div class="question-text">

            ${escapeHTML(question.question)}

        </div>


        ${diagramHTML}


        <div class="options">

            ${optionsHTML}

        </div>


        <div class="actions">

            <button
                id="nextButton"
                type="button"
                class="next-btn"
                disabled
                onclick="nextQuestion()"
            >

                ${
                    number === total
                        ? "Finish"
                        : "Next →"
                }

            </button>

        </div>

    </div>

`;
    }

    catch (error) {

        console.error("SHOW QUESTION ERROR =", error);

    }

}


/* =========================
   SELECT ANSWER
========================= */

function selectAnswer(answer, button) {

    selectedAnswer = answer;


    document
        .querySelectorAll(".option")
        .forEach(option => {

            option.classList.remove("selected");

        });


    button.classList.add("selected");


    const nextButton =
        document.getElementById("nextButton");


    if (nextButton) {

        nextButton.disabled = false;

    }

}


/* =========================
   NEXT QUESTION
========================= */

function nextQuestion() {

    if (selectedAnswer === null) {

        return;

    }


    const question =
        questions[currentQuestionIndex];


    if (!question) {

        return;

    }


    const selectedOption =
        question._options.find(
            option =>
                option.option_letter ===
                selectedAnswer
        );


    const correctOption =
        question._options.find(
            option =>
                option.option_letter ===
                question.correct_answer
        );


    const isCorrect =
        selectedAnswer ===
        question.correct_answer;


    if (isCorrect) {

        score++;

    }


    answerReview.push({

        questionId: question.id,

        question: question.question,

        selectedAnswer: selectedAnswer,

        selectedAnswerText:
            selectedOption
                ? selectedOption.option_text
                : "",

        correctAnswer:
            question.correct_answer,

        correctAnswerText:
            correctOption
                ? correctOption.option_text
                : "",

        explanation:
            question.explanation || "",

        isCorrect: isCorrect

    });


    currentQuestionIndex++;


    if (
        currentQuestionIndex >=
        questions.length
    ) {

        finishPractice();

        return;

    }


    showQuestion();

}


/* =========================
   FINISH PRACTICE
========================= */

async function finishPractice() {

    localStorage.setItem(
        "quizScore",
        score
    );


    localStorage.setItem(
        "quizTotal",
        questions.length
    );


    localStorage.setItem(
        "practiceTopic",
        topicName
    );


    localStorage.setItem(
        "practiceDifficulty",
        difficulty
    );


    localStorage.setItem(
        "answerReview",
        JSON.stringify(answerReview)
    );


    console.log(
        "ANSWER REVIEW =",
        answerReview
    );


          // =========================
    // SAVE USER QUESTION PROGRESS
    // =========================

    const {
        data: { user },
        error: userError
    } = await window.supabaseClient.auth.getUser();


    if (userError || !user) {

        console.error(
            "User not found:",
            userError
        );

    } else {

        const progressData =
            answerReview.map(item => ({

                user_id: user.id,

                question_id: item.questionId,

                is_correct: item.isCorrect

            }));


        const { error: progressError } =
            await window.supabaseClient
            .from("user_question_progress")
            .upsert(
                progressData,
                {
                    onConflict:
                        "user_id,question_id",

                    ignoreDuplicates: true
                }
            );


        if (progressError) {

            console.error(
                "Error saving progress:",
                progressError
            );

        } else {

            console.log(
                "Question progress saved successfully"
            );

        }

    }
    window.location.href =
        "results.html";

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}


/* =========================
   ESCAPE ATTRIBUTE
========================= */

function escapeValue(value) {

    return String(value)

        .replace(/\\/g, "\\\\")

        .replace(/'/g, "\\'");

}

/* =========================
   LOAD LOGO SAFELY
========================= */

function loadLogoData(){

    return new Promise((resolve) => {

        const image = new Image();

        image.onload = function(){

            try{

                const canvas =
                    document.createElement("canvas");

                canvas.width =
                    image.naturalWidth;

                canvas.height =
                    image.naturalHeight;

                const ctx =
                    canvas.getContext("2d");

                ctx.drawImage(
                    image,
                    0,
                    0
                );

                resolve(
                    canvas.toDataURL("image/png")
                );

            }

            catch(error){

                console.warn(
                    "LOGO CONVERSION ERROR:",
                    error
                );

                resolve(null);

            }

        };


        image.onerror = function(){

            console.warn(
                "LOGO FAILED TO LOAD"
            );

            resolve(null);

        };


        image.src =
            "assets/images/logo.png";

    });

}


/* =========================
   SAFE ADD IMAGE
========================= */

function addImageSafely(
    doc,
    logo,
    x,
    y,
    width,
    height
){

    if(!logo){

        return;

    }

    try{

        doc.addImage(

            logo,

            "PNG",

            x,

            y,

            width,

            height

        );

    }

    catch(error){

        console.warn(
            "PDF IMAGE ERROR:",
            error
        );

    }

}


/* =========================
   ADD WATERMARK
========================= */

function addWatermark(
    doc,
    logo
){

    if(!logo){

        return;

    }


    const pageWidth =
        doc.internal.pageSize.getWidth();


    const pageHeight =
        doc.internal.pageSize.getHeight();


    try{

        /*
        Tunatumia opacity kama
        jsPDF browser yako ina-support
        */

        if(
            doc.GState &&
            doc.setGState
        ){

            doc.saveGraphicsState();

            doc.setGState(

                new doc.GState({

                    opacity:0.08

                })

            );


            addImageSafely(

                doc,

                logo,

                pageWidth / 2 - 55,

                pageHeight / 2 - 35,

                110,

                70

            );


            doc.restoreGraphicsState();

        }

        else{

            /*
            Fallback bila error
            */

            addImageSafely(

                doc,

                logo,

                pageWidth / 2 - 55,

                pageHeight / 2 - 35,

                110,

                70

            );

        }

    }

    catch(error){

        console.warn(
            "WATERMARK ERROR:",
            error
        );

    }

}

========================= */

function cleanPDFText(value){

    if(
        value === null ||
        value === undefined
    ){
        return "";
    }

    return String(value)

        .replace(/\u00A0/g, " ")

        // Mathematical symbols
        .replace(/×/g, " × ")
        .replace(/x(?=\s*\^)/g, "×")
        .replace(/÷/g, " ÷ ")
          

        .replace(/[−–—]/g, "−")

        
        // Square root
.replace(/√/g, "[[SQRT]]")
.replace(/sqrt\s*/gi, "[[SQRT]]")

        // Common fractions
        .replace(/½/g, "½")
        .replace(/⅓/g, "⅓")
        .replace(/¼/g, "¼")
        .replace(/¾/g, "¾")

        // Convert ^numbers into superscripts
        .replace(/\^0/g, "⁰")
        .replace(/\^1/g, "¹")
        .replace(/\^2/g, "²")
        .replace(/\^3/g, "³")
        .replace(/\^4/g, "⁴")
        .replace(/\^5/g, "⁵")
        .replace(/\^6/g, "⁶")
        .replace(/\^7/g, "⁷")
        .replace(/\^8/g, "⁸")
        .replace(/\^9/g, "⁹")

        // Superscript common negative powers
        .replace(/\^\(-1\)/g, "⁻¹")
        .replace(/\^\(-2\)/g, "⁻²")
        .replace(/\^\(-3\)/g, "⁻³")

        .replace(/\s+/g, " ")

        .trim();
}

async function loadNotoSans(doc){

    const response = await fetch(
        "assets/fonts/NotoSans-Regular.ttf"
    );

    if(!response.ok){
        throw new Error(
            "Failed to load Noto Sans font."
        );
    }

    const arrayBuffer =
        await response.arrayBuffer();

    const bytes =
        new Uint8Array(arrayBuffer);

    let binary = "";

    const chunkSize = 0x8000;

    for(
        let i = 0;
        i < bytes.length;
        i += chunkSize
    ){

        binary += String.fromCharCode(
            ...bytes.subarray(
                i,
                Math.min(
                    i + chunkSize,
                    bytes.length
                )
            )
        );

    }

    const base64 =
        btoa(binary);

    doc.addFileToVFS(
        "NotoSans-Regular.ttf",
        base64
    );

    doc.addFont(
        "NotoSans-Regular.ttf",
        "NotoSans",
        "normal"
    );

    doc.setFont(
        "NotoSans",
        "normal"
    );
}

async function svgToPNG(svgString){

    if(!svgString){
        return null;
    }

    return new Promise((resolve, reject) => {

        try{

            const svgBlob = new Blob(
                [svgString],
                {
                    type:"image/svg+xml;charset=utf-8"
                }
            );

            const url =
                URL.createObjectURL(svgBlob);

            const img = new Image();

            img.onload = function(){

                try{

                    const scale = 2;

                    const canvas =
                        document.createElement("canvas");

                    canvas.width =
                        img.naturalWidth * scale;

                    canvas.height =
                        img.naturalHeight * scale;

                    const ctx =
                        canvas.getContext("2d");

                    ctx.fillStyle = "#FFFFFF";

                    ctx.fillRect(
                        0,
                        0,
                        canvas.width,
                        canvas.height
                    );

                    ctx.drawImage(
                        img,
                        0,
                        0,
                        canvas.width,
                        canvas.height
                    );

                    URL.revokeObjectURL(url);

                    resolve(
                        canvas.toDataURL("image/png")
                    );

                }
                catch(error){

                    URL.revokeObjectURL(url);

                    reject(error);

                }

            };

            img.onerror = function(){

                URL.revokeObjectURL(url);

                reject(
                    new Error(
                        "Failed to render question figure."
                    )
                );

            };

            img.src = url;

        }
        catch(error){

            reject(error);

        }

    });

}
function addTextToPDF(
    doc,
    text,
    y,
    logo,
    title,
    options = {}
){

    const pageWidth =
        doc.internal.pageSize.getWidth();

    const pageHeight =
        doc.internal.pageSize.getHeight();

    const margin =
        options.margin || 22;

    const fontSize =
        options.fontSize || 11;

    const lineHeight =
        options.lineHeight || 7;

    const bottomSpace =
        options.bottomSpace || 28;

    const maxWidth =
        pageWidth - (margin * 2);


    /*
    =====================================
    CLEAN TEXT
    =====================================
    */

    const cleanText =
        cleanPDFText(text);


    /*
    =====================================
    SPLIT INTO LINES
    =====================================
    */

    const lines =
        doc.splitTextToSize(
            cleanText,
            maxWidth
        );


    const requiredHeight =
        (lines.length * lineHeight) + 8;


    /*
    =====================================
    PAGE BREAK
    =====================================
    */

    if(
        y + requiredHeight >
        pageHeight - bottomSpace
    ){

        y =
            createPDFPage(
                doc,
                logo,
                title
            );

    }


    /*
    =====================================
    FONT
    =====================================
    */

    doc.setFont(
        "NotoSans",
        "normal"
    );

    doc.setFontSize(
        fontSize
    );


    /*
    =====================================
    DRAW EACH LINE
    =====================================
    */

    lines.forEach(
        (line, lineIndex) => {

            const lineY =
                y +
                (lineIndex * lineHeight);


            /*
            ---------------------------------
            Split mathematical symbols
            from normal text
            ---------------------------------
            */

           const parts =
    line.split(
        /(\[\[SQRT\]\]|[⁰¹²³⁴⁵⁶⁷⁸⁹₀₁₂₃₄₅₆₇₈₉]|×|÷|−)/
    );

            let currentX =
                margin;


            parts.forEach(
                part => {

                    if(!part){
                        return;
                    }


                    /*
                    =============================
                    SUPERSCRIPTS
                    =============================
                    */

                    if(
                        /^[⁰¹²³⁴⁵⁶⁷⁸⁹]+$/.test(part)
                    ){

                        doc.setFontSize(
                            fontSize * 0.70
                        );


                        doc.text(
                            part,
                            currentX,
                            lineY - 2
                        );


                        currentX +=
                            doc.getTextWidth(
                                part
                            );


                        doc.setFontSize(
                            fontSize
                        );

                        return;
                    }


                    /*
                    =============================
                    SUBSCRIPTS
                    =============================
                    */

                    if(
                        /^[₀₁₂₃₄₅₆₇₈₉]+$/.test(part)
                    ){

                        doc.setFontSize(
                            fontSize * 0.70
                        );


                        doc.text(
                            part,
                            currentX,
                            lineY + 1.5
                        );


                        currentX +=
                            doc.getTextWidth(
                                part
                            );


                        doc.setFontSize(
                            fontSize
                        );

                        return;
                    }


                    /*
                    =============================
                    SQUARE ROOT
                    =============================
                    */

                   if(part === "[[SQRT]]"){

    /*
    =============================
    DRAW SQUARE ROOT MANUALLY
    =============================
    */

    const rootSize = fontSize * 0.85;

    const rootWidth = 4;

    const rootHeight = 5;


    /*
    Draw the radical check mark
    */

    doc.setLineWidth(0.35);

    doc.line(
        currentX,
        lineY - 1,
        currentX + 1.5,
        lineY + 2
    );

    doc.line(
        currentX + 1.5,
        lineY + 2,
        currentX + 3,
        lineY - 4
    );


    /*
    Top horizontal bar
    */

    doc.line(
        currentX + 3,
        lineY - 4,
        currentX + rootWidth + 4,
        lineY - 4
    );


    currentX +=
        rootWidth + 4;

    return;
}

                    /*
                    =============================
                    OTHER MATH SYMBOLS
                    =============================
                    */

                    if(
                        part === "×" ||
                        part === "÷" ||
                        part === "−"
                    ){

                        doc.text(
                            part,
                            currentX,
                            lineY
                        );


                        currentX +=
                            doc.getTextWidth(
                                part
                            );

                        return;
                    }


                    /*
                    =============================
                    NORMAL TEXT
                    =============================
                    */

                    doc.text(
                        part,
                        currentX,
                        lineY
                    );


                    currentX +=
                        doc.getTextWidth(
                            part
                        );

                }
            );

        }
    );


    return (
        y +
        (lines.length * lineHeight)
    );

}

async function getCorrectAnswers(
    questions
){

    const questionIds =
        questions.map(
            question =>
                question.id
        );


    if(
        questionIds.length === 0
    ){

        return [];

    }


    const {

        data,

        error

    } = await window.supabaseClient

        .from("question_options")

        .select("*")

        .in(
            "question_id",

            questionIds

        );


    if(error){

        console.error(

            "OPTIONS PDF ERROR:",

            error

        );

        return [];

    }


    return data || [];

}
