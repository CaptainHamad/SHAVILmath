<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Practice Questions | SHAVILmath</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Poppins,sans-serif;
}

body{

    background:#F4F7FB;

    color:#0F172A;

    min-height:100vh;

}


/* =========================
   HEADER
========================= */

header{

    background:#2563EB;

    padding:18px 8%;

    display:flex;

    justify-content:space-between;

    align-items:center;

    color:white;

}

header img{

    height:55px;

}

header a{

    color:white;

    text-decoration:none;

    font-weight:600;

}


/* =========================
   MAIN CONTAINER
========================= */

.container{

    width:100%;

    max-width:900px;

    margin:auto;

    padding:40px 20px 70px;

}


/* =========================
   TOP INFORMATION
========================= */

.top-card{

    background:white;

    padding:25px 30px;

    border-radius:20px;

    box-shadow:0 10px 30px rgba(0,0,0,.07);

    margin-bottom:25px;

}

.top-card h1{

    font-size:28px;

    margin-bottom:5px;

}

.top-card p{

    color:#64748B;

    font-size:15px;

}


/* =========================
   PROGRESS
========================= */

.progress-info{

    display:flex;

    justify-content:space-between;

    margin-top:22px;

    margin-bottom:8px;

    font-size:14px;

    color:#64748B;

}

.progress{

    width:100%;

    height:9px;

    background:#E2E8F0;

    border-radius:20px;

    overflow:hidden;

}

.progress-bar{

    height:100%;

    width:0%;

    background:#2563EB;

    transition:.3s;

}


/* =========================
   QUESTION CARD
========================= */

.question-card{

    background:white;

    padding:35px;

    border-radius:22px;

    box-shadow:0 15px 40px rgba(0,0,0,.08);

}

.question-label{

    color:#2563EB;

    font-weight:700;

    font-size:15px;

    margin-bottom:15px;

}

.question-text{

    font-size:22px;

    font-weight:600;

    line-height:1.6;

    margin-bottom:30px;

    white-space:pre-wrap;

}

/* =========================
   QUESTION DIAGRAM
========================= */

.question-diagram{
    width:100%;
    margin:10px 0 30px;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow-x:auto;
}

.question-diagram svg{
    width:100%;
    max-width:600px;
    height:auto;
    display:block;
}


/* =========================
   OPTIONS
========================= */

.options{

    display:flex;

    flex-direction:column;

    gap:14px;

}

.option{

    width:100%;

    padding:17px 20px;

    background:white;

    border:2px solid #E2E8F0;

    border-radius:14px;

    text-align:left;

    font-size:16px;

    cursor:pointer;

    transition:.2s;

    color:#0F172A;

}

.option:hover{

    border-color:#2563EB;

    background:#EFF6FF;

}

.option.selected{

    border-color:#2563EB;

    background:#EFF6FF;

}

.option-letter{

    display:inline-flex;

    align-items:center;

    justify-content:center;

    width:32px;

    height:32px;

    border-radius:50%;

    background:#E2E8F0;

    margin-right:10px;

    font-weight:700;

}

.option.selected .option-letter{

    background:#2563EB;

    color:white;

}


/* =========================
   ACTIONS
========================= */

.actions{

    display:flex;

    justify-content:flex-end;

    margin-top:30px;

}

.next-btn{

    padding:14px 30px;

    border:none;

    border-radius:12px;

    background:#2563EB;

    color:white;

    font-size:16px;

    font-weight:600;

    cursor:pointer;

}

.next-btn:hover{

    background:#1D4ED8;

}

.next-btn:disabled{

    background:#CBD5E1;

    cursor:not-allowed;

}


/* =========================
   LOADING
========================= */

.loading{

    background:white;

    padding:70px 20px;

    border-radius:20px;

    text-align:center;

    color:#64748B;

    font-size:18px;

}


/* =========================
   ERROR
========================= */

.error{

    background:white;

    padding:50px 25px;

    border-radius:20px;

    text-align:center;

    color:#DC2626;

}

.error h2{

    margin-bottom:10px;

}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    header{

        padding:15px 20px;

    }

    header img{

        height:45px;

    }

    .container{

        padding:25px 15px 50px;

    }

    .top-card{

        padding:22px;

    }

    .question-card{

        padding:25px 20px;

    }

    .question-text{

        font-size:19px;

    }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

    <img src="assets/images/logo.png">

    <a href="difficulty.html">

        ⬅ Back

    </a>

</header>



<!-- =========================
     MAIN
========================= -->

<div class="container">


    <!-- TOP CARD -->

    <div class="top-card">

        <h1 id="topicTitle">

            Loading...

        </h1>

        <p id="difficultyTitle">

            Loading difficulty...

        </p>


        <div class="progress-info">

            <span id="questionNumber">

                Question 0 of 0

            </span>

            <span id="scoreDisplay">

                Score: 0

            </span>

        </div>


        <div class="progress">

            <div
                id="progressBar"
                class="progress-bar">
            </div>

        </div>

    </div>



    <!-- QUESTION -->

    <div id="questionContainer">

        <div class="loading">

            Loading questions...

        </div>

    </div>


</div>



<!-- =========================
     SUPABASE
========================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<script>

const topicId =
    localStorage.getItem("selectedTopicId");

const topicName =
    localStorage.getItem("selectedTopic");

const difficulty =
    localStorage.getItem("difficulty");

const dailyQuestionId =
    localStorage.getItem(
        "dailyQuestionId"
    );
console.log("TOPIC ID =", topicId);
console.log("TOPIC =", topicName);
console.log("DIFFICULTY =", difficulty);


const topicTitle =
    document.getElementById("topicTitle");

const difficultyTitle =
    document.getElementById("difficultyTitle");

const questionNumber =
    document.getElementById("questionNumber");

const scoreDisplay =
    document.getElementById("scoreDisplay");

const progressBar =
    document.getElementById("progressBar");

const questionContainer =
    document.getElementById("questionContainer");


let questions = [];

let currentQuestionIndex = 0;

let score = 0;

let selectedAnswer = null;

let answerReview = [];


/* =========================
   TOPIC
========================= */

if(dailyQuestionId){

    topicTitle.textContent =
        "📅 Question of the Day";

    difficultyTitle.textContent =
        topicName ||
        "Today's Mathematics Challenge";

}

else{

    topicTitle.textContent =
        topicName ||
        "Practice Questions";


    if(difficulty == "1"){

        difficultyTitle.textContent =
            "Easy Level • 15 Questions";

    }

    else if(difficulty == "2"){

        difficultyTitle.textContent =
            "Medium Level • 15 Questions";

    }

    else if(difficulty == "3"){

        difficultyTitle.textContent =
            "Hard Level • 15 Questions";

    }

    else if(difficulty == "Mixed"){

        difficultyTitle.textContent =
            "Mixed Level • 15 Questions";

    }

    else{

        difficultyTitle.textContent =
            "Practice Questions";

    }

}


/* =========================
   LOAD QUESTIONS
========================= */

async function loadQuestions() {

    try {

        // =====================================
// QUESTION OF THE DAY
// =====================================

if(dailyQuestionId){

    const {

        data,

        error

    } = await window.supabaseClient

        .from("questions")

        .select("*")

        .eq(
            "id",
            Number(dailyQuestionId)
        )

        .eq(
            "status",
            "Published"
        );


    if(error){

        throw error;

    }


    if(!data || data.length === 0){

        questionContainer.innerHTML = `

            <div class="error">

                <h2>Question not available</h2>

                <p>
                    Today's question could not be found.
                </p>

            </div>

        `;

        return;

    }


    questions = data;


    currentQuestionIndex = 0;

    score = 0;

    answerReview = [];


    showQuestion();

    return;

}


// =====================================
// NORMAL EXERCISES
// =====================================

if(!topicId){

    questionContainer.innerHTML = `

        <div class="error">

            <h2>No topic selected</h2>

            <p>
                Please go back and select a topic.
            </p>

        </div>

    `;

    return;

}


if(

    difficulty !== "1" &&
    difficulty !== "2" &&
    difficulty !== "3" &&
    difficulty !== "Mixed"

){

    questionContainer.innerHTML = `

        <div class="error">

            <h2>Invalid difficulty</h2>

            <p>
                Please go back and select
                a difficulty level.
            </p>

        </div>

    `;

    return;

}


let query = window.supabaseClient

    .from("questions")

    .select("*")

    .eq(
        "topic_id",
        Number(topicId)
    )

    .eq(
        "status",
        "Published"
    );


if(difficulty === "Mixed"){

    query = query

        .eq(
            "set_name",
            "Mixed"
        );

}

else{

    query = query

        .eq(
            "difficulty",
            Number(difficulty)
        )

        .neq(
            "set_name",
            "Mixed"
        );

}


const {

    data,

    error

} = await query.order(
    "question_order",
    {
        ascending:true
    }
);
        console.log("QUESTIONS =", data);

        console.log("QUESTION ERROR =", error);


        if (error) {

            questionContainer.innerHTML = `
                <div class="error">

                    <h2>Unable to load questions</h2>

                    <p>
                        ${escapeHTML(error.message)}
                    </p>

                </div>
            `;

            return;

        }


        if (!data || data.length === 0) {

            questionContainer.innerHTML = `
                <div class="error">

                    <h2>No questions available</h2>

                    <p>
                        There are no questions for
                        this topic and difficulty yet.
                    </p>

                </div>
            `;

            return;

        }


        questions = data.slice(0, 15);


        currentQuestionIndex = 0;

        score = 0;

        answerReview = [];

        showQuestion();

    }

    catch (error) {

        console.error("LOAD QUESTIONS ERROR =", error);

        questionContainer.innerHTML = `
            <div class="error">

                <h2>Something went wrong</h2>

                <p>
                    ${escapeHTML(error.message)}
                </p>

            </div>
        `;

    }

}


/* =========================
   SHOW QUESTION
========================= */

async function showQuestion() {

    try {

        selectedAnswer = null;


        const question =
            questions[currentQuestionIndex];


        if (!question) {

            return;

        }


        const number =
            currentQuestionIndex + 1;

        const total =
            questions.length;


        questionNumber.textContent =
            `Question ${number} of ${total}`;


        scoreDisplay.textContent =
            `Score: ${score}`;


        const percentage =
            (number / total) * 100;


        progressBar.style.width =
            percentage + "%";


        const {
            data: options,
            error
        } = await window.supabaseClient

            .from("question_options")

            .select("*")

            .eq("question_id", question.id)

            .order("option_order", {
                ascending: true
            });


        console.log("OPTIONS =", options);

        console.log("OPTION ERROR =", error);


        if (error) {

            questionContainer.innerHTML = `
                <div class="error">

                    <h2>Unable to load answers</h2>

                    <p>
                        ${escapeHTML(error.message)}
                    </p>

                </div>
            `;

            return;

        }


        question._options = options || [];


        let optionsHTML = "";


        question._options.forEach(option => {

            optionsHTML += `

                <button
                    type="button"
                    class="option"
                    onclick="selectAnswer('${escapeValue(option.option_letter)}', this)"
                >

                    <span class="option-letter">

                        ${escapeHTML(option.option_letter)}

                    </span>

                    <span>

                        ${escapeHTML(option.option_text)}

                    </span>

                </button>

            `;

        });


       const diagramHTML =
    question.diagram_svg
        ? `
            <div class="question-diagram">
                ${question.diagram_svg}
            </div>
        `
        : "";


questionContainer.innerHTML = `

    <div class="question-card">

        <div class="question-label">

            Question ${number}

        </div>


        <div class="question-text">

            ${escapeHTML(question.question)}

        </div>


        ${diagramHTML}


        <div class="options">

            ${optionsHTML}

        </div>


        <div class="actions">

            <button
                id="nextButton"
                type="button"
                class="next-btn"
                disabled
                onclick="nextQuestion()"
            >

                ${
                    number === total
                        ? "Finish"
                        : "Next →"
                }

            </button>

        </div>

    </div>

`;
    }

    catch (error) {

        console.error("SHOW QUESTION ERROR =", error);

    }

}


/* =========================
   SELECT ANSWER
========================= */

function selectAnswer(answer, button) {

    selectedAnswer = answer;


    document
        .querySelectorAll(".option")
        .forEach(option => {

            option.classList.remove("selected");

        });


    button.classList.add("selected");


    const nextButton =
        document.getElementById("nextButton");


    if (nextButton) {

        nextButton.disabled = false;

    }

}


/* =========================
   NEXT QUESTION
========================= */

function nextQuestion() {

    if (selectedAnswer === null) {

        return;

    }


    const question =
        questions[currentQuestionIndex];


    if (!question) {

        return;

    }


    const selectedOption =
        question._options.find(
            option =>
                option.option_letter ===
                selectedAnswer
        );


    const correctOption =
        question._options.find(
            option =>
                option.option_letter ===
                question.correct_answer
        );


    const isCorrect =
        selectedAnswer ===
        question.correct_answer;


    if (isCorrect) {

        score++;

    }


    answerReview.push({

        questionId: question.id,

        question: question.question,

        selectedAnswer: selectedAnswer,

        selectedAnswerText:
            selectedOption
                ? selectedOption.option_text
                : "",

        correctAnswer:
            question.correct_answer,

        correctAnswerText:
            correctOption
                ? correctOption.option_text
                : "",

        explanation:
            question.explanation || "",

        isCorrect: isCorrect

    });


    currentQuestionIndex++;


    if (
        currentQuestionIndex >=
        questions.length
    ) {

        finishPractice();

        return;

    }


    showQuestion();

}


/* =========================
   FINISH PRACTICE
========================= */

async function finishPractice() {

    localStorage.setItem(
        "quizScore",
        score
    );


    localStorage.setItem(
        "quizTotal",
        questions.length
    );


    localStorage.setItem(
        "practiceTopic",
        topicName
    );


    localStorage.setItem(
        "practiceDifficulty",
        difficulty
    );


    localStorage.setItem(
        "answerReview",
        JSON.stringify(answerReview)
    );


    console.log(
        "ANSWER REVIEW =",
        answerReview
    );


          // =========================
    // SAVE USER QUESTION PROGRESS
    // =========================

    const {
        data: { user },
        error: userError
    } = await window.supabaseClient.auth.getUser();


    if (userError || !user) {

        console.error(
            "User not found:",
            userError
        );

    } else {

        const progressData =
            answerReview.map(item => ({

                user_id: user.id,

                question_id: item.questionId,

                is_correct: item.isCorrect

            }));


        const { error: progressError } =
            await window.supabaseClient
            .from("user_question_progress")
            .upsert(
                progressData,
                {
                    onConflict:
                        "user_id,question_id",

                    ignoreDuplicates: true
                }
            );


        if (progressError) {

            console.error(
                "Error saving progress:",
                progressError
            );

        } else {

            console.log(
                "Question progress saved successfully"
            );

        }

    }
    window.location.href =
        "results.html";

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}


/* =========================
   ESCAPE ATTRIBUTE
========================= */

function escapeValue(value) {

    return String(value)

        .replace(/\\/g, "\\\\")

        .replace(/'/g, "\\'");

}


/* =========================
   START
========================= */

loadQuestions();

</script>

</body>

</html>
