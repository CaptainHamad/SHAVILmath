<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Results | SHAVILmath</title>

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet">


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Poppins,sans-serif;
}


body{

    background:#F4F7FB;

    color:#0F172A;

    min-height:100vh;

}


header{

    background:#2563EB;

    padding:18px 8%;

    display:flex;

    justify-content:space-between;

    align-items:center;

    color:white;

}


header img{

    height:55px;

}


header a{

    color:white;

    text-decoration:none;

    font-weight:600;

}


.container{

    width:100%;

    max-width:900px;

    margin:auto;

    padding:40px 20px 70px;

}


.result-card{

    background:white;

    padding:40px;

    border-radius:25px;

    text-align:center;

    box-shadow:0 15px 40px rgba(0,0,0,.08);

}


.icon{

    font-size:55px;

    margin-bottom:10px;

}


h1{

    font-size:32px;

    margin-bottom:8px;

}


.subtitle{

    color:#64748B;

    margin-bottom:30px;

}


.score-box{

    background:#EFF6FF;

    padding:25px;

    border-radius:20px;

    margin-bottom:25px;

}


.score{

    font-size:55px;

    font-weight:800;

    color:#2563EB;

}


.score-label{

    color:#64748B;

}


.topic{

    font-size:18px;

    font-weight:700;

}


.difficulty{

    color:#64748B;

    margin-top:5px;

}


.review-title{

    margin-top:40px;

    margin-bottom:20px;

    font-size:26px;

    text-align:left;

}


.review{

    display:flex;

    flex-direction:column;

    gap:20px;

}


.review-card{

    background:white;

    border-radius:18px;

    padding:25px;

    box-shadow:0 10px 30px rgba(0,0,0,.07);

    border-left:5px solid #DC2626;

}


.review-number{

    color:#DC2626;

    font-weight:700;

    font-size:14px;

    margin-bottom:10px;

}


.question{

    font-size:18px;

    font-weight:600;

    line-height:1.6;

    margin-bottom:20px;

}


.answer-row{

    padding:12px 15px;

    border-radius:10px;

    margin-top:10px;

}


.your-answer{

    background:#FEF2F2;

    color:#991B1B;

}


.correct-answer{

    background:#F0FDF4;

    color:#166534;

}


.answer-label{

    font-size:13px;

    font-weight:700;

    display:block;

    margin-bottom:3px;

}


.explanation{

    margin-top:18px;

    padding:15px;

    background:#F8FAFC;

    border-radius:10px;

    color:#475569;

    line-height:1.6;

}


.buttons{

    display:flex;

    flex-direction:column;

    gap:14px;

    margin-top:35px;

}


button{

    width:100%;

    padding:15px;

    border:none;

    border-radius:12px;

    font-size:16px;

    font-weight:600;

    cursor:pointer;

}


.primary{

    background:#2563EB;

    color:white;

}


.primary:hover{

    background:#1D4ED8;

}


.secondary{

    background:#E2E8F0;

    color:#0F172A;

}


.secondary:hover{

    background:#CBD5E1;

}


.no-mistakes{

    background:#F0FDF4;

    color:#166534;

    padding:25px;

    border-radius:15px;

    margin-top:30px;

    font-weight:600;

}


@media(max-width:600px){

    header{

        padding:15px 20px;

    }


    header img{

        height:45px;

    }


    .container{

        padding:25px 15px 50px;

    }


    .result-card{

        padding:30px 20px;

    }


    .score{

        font-size:45px;

    }


    .question{

        font-size:17px;

    }

}

</style>

</head>


<body>


<header>

    <img src="assets/images/logo.png">

    <a href="dashboard.html">

        ⬅ Dashboard

    </a>

</header>



<div class="container">


    <!-- =========================
         RESULT SUMMARY
    ========================= -->

    <div class="result-card">


        <div class="icon">

            🎉

        </div>


        <h1>

            Practice Complete!

        </h1>


        <p class="subtitle">

            Well done! Review your mistakes below
            and learn from them.

        </p>


        <div class="score-box">

            <div
                id="score"
                class="score">

                0 / 0

            </div>


            <div class="score-label">

                Your Score

            </div>

        </div>


        <div
            id="topic"
            class="topic">

            Numbers

        </div>


        <div
            id="difficulty"
            class="difficulty">

            Easy Level

        </div>


    </div>



    <!-- =========================
         WRONG QUESTIONS
    ========================= -->

    <h2
        id="reviewTitle"
        class="review-title">

        Questions You Got Wrong

    </h2>


    <div
        id="reviewContainer"
        class="review">

    </div>



    <!-- =========================
         BUTTONS
    ========================= -->

    <div class="buttons">


        <button
            class="primary"
            onclick="tryAgain()">

            🔄 Try Again

        </button>


        <button
            class="secondary"
            onclick="goBackToTopics()">

            📚 Choose Another Topic

        </button>


        <button
            class="secondary"
            onclick="goDashboard()">

            🏠 Dashboard

        </button>


    </div>


</div>



<script>


/* =========================
   GET RESULT DATA
========================= */

const score =
    Number(localStorage.getItem("quizScore")) || 0;


const total =
    Number(localStorage.getItem("quizTotal")) || 0;


const topic =
    localStorage.getItem("practiceTopic")
    || "Practice";


const difficulty =
    localStorage.getItem("practiceDifficulty");


const reviewData =
    JSON.parse(
        localStorage.getItem("answerReview")
        || "[]"
    );



/* =========================
   DISPLAY SCORE
========================= */

document.getElementById("score").textContent =
    `${score} / ${total}`;


document.getElementById("topic").textContent =
    topic;



/* =========================
   DIFFICULTY
========================= */

if(difficulty == "1"){

    document.getElementById("difficulty").textContent =
        "Easy Level";

}

else if(difficulty == "2"){

    document.getElementById("difficulty").textContent =
        "Medium Level";

}

else if(difficulty == "3"){

    document.getElementById("difficulty").textContent =
        "Hard Level";

}

else{

    document.getElementById("difficulty").textContent =
        "Practice";

}



/* =========================
   GET WRONG ANSWERS
========================= */

const wrongAnswers =
    reviewData.filter(
        item => item.isCorrect === false
    );


const reviewContainer =
    document.getElementById("reviewContainer");


const reviewTitle =
    document.getElementById("reviewTitle");



/* =========================
   NO MISTAKES
========================= */

if(wrongAnswers.length === 0){

    reviewTitle.textContent =
        "Excellent Work! 🎉";


    reviewContainer.innerHTML = `

        <div class="no-mistakes">

            🎯 Perfect!

            <br><br>

            You answered every question correctly.

        </div>

    `;

}



/* =========================
   SHOW WRONG ANSWERS
========================= */

else{

    reviewTitle.textContent =
        `Questions You Got Wrong (${wrongAnswers.length})`;


    wrongAnswers.forEach(
        (item,index) => {


        const card =
            document.createElement("div");


        card.className =
            "review-card";


        card.innerHTML = `

            <div class="review-number">

                Question ${index + 1}

            </div>


            <div class="question">

                ${escapeHTML(item.question)}

            </div>


            <div class="answer-row your-answer">

                <span class="answer-label">

                    YOUR ANSWER

                </span>

                ${escapeHTML(
                    item.selectedAnswer
                )}

                ${item.selectedAnswerText
                    ? " — " +
                      escapeHTML(
                          item.selectedAnswerText
                      )
                    : ""
                }

            </div>


            <div class="answer-row correct-answer">

                <span class="answer-label">

                    CORRECT ANSWER

                </span>

                ${escapeHTML(
                    item.correctAnswer
                )}

                ${item.correctAnswerText
                    ? " — " +
                      escapeHTML(
                          item.correctAnswerText
                      )
                    : ""
                }

            </div>


            ${
                item.explanation
                ?

                `

                <div class="explanation">

                    <strong>
                        Explanation:
                    </strong>

                    <br>

                    ${escapeHTML(
                        item.explanation
                    )}

                </div>

                `

                :

                ""

            }

        `;


        reviewContainer.appendChild(card);


    });

}



/* =========================
   TRY AGAIN
========================= */

function tryAgain(){

    window.location.href =
        "questions.html";

}



/* =========================
   TOPICS
========================= */

function goBackToTopics(){

    window.location.href =
        "topics.html";

}



/* =========================
   DASHBOARD
========================= */

function goDashboard(){

    window.location.href =
        "dashboard.html";

}



/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }


    return String(value)

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");

}

</script>


</body>

</html>
